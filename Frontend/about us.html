<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Makers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f4f7f9;
            color: #2c3e50;
            text-align: center;
            padding: 20px;
        }
        header {
            background-color: #34495e;
            color: white;
            padding: 25px 0;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
       
        
        .card h2 {
            font-size: 22px;
            color: #2980b9;
        }
        .card p {
            font-size: 16px;
            color: #555;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .card {
                width: 80%;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <header>Meet the Makers</header>
    <div class="container">
        <div class="card">
            <img src="heet.jpg" alt="Heet">
            <h2>Heet</h2>
            <p>Frontend Developer & UI Designer, bringing creativity to life with modern web designs.</p>
        </div>
        <div class="card">
            <img src="tirth.jpg" alt="Tirth">
            <h2>Tirth</h2>
            <p>Backend Specialist, ensuring smooth functionality and database management.</p>
        </div>
        <div class="card">
            <img src="ved.jpg" alt="Ved">
            <h2>Ved</h2>
            <p>Full-Stack Developer, merging frontend and backend for seamless user experience.</p>
        </div>
    </div>
</body>
</html>
