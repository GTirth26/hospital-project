<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Contact</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }

        header {
            background-color: #d32f2f;
            color: white;
            padding: 15px;
            font-size: 24px;
        }

        main {
            margin-top: 20px;
        }

        .contact-card {
            background: white;
            padding: 15px;
            margin: 10px auto;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .contact-card h2 {
            color: #d32f2f;
        }

        footer {
            margin-top: 20px;
            background: #333;
            color: white;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Emergency Contact Information</h1>
    </header>

    <main>
        <section class="contact-card">
            <h2>🚑 Ambulance</h2>
            <p>📞 <strong>Call:</strong> 102 / 108</p>
        </section>

        <section class="contact-card">
            <h2>🚓 Police</h2>
            <p>📞 <strong>Call:</strong> 100</p>
        </section>

        <section class="contact-card">
            <h2>🔥 Fire Brigade</h2>
            <p>📞 <strong>Call:</strong> 101</p>
        </section>

        <section class="contact-card">
            <h2>🏥 Nearest Hospital</h2>
            <p>📍 <strong>Address:</strong> XYZ Hospital, ABC Road, Your City</p>
            <p>📞 <strong>Call:</strong> +91-9876543210</p>
        </section>
    </main>

    <footer>
        <p>⚠️ Stay Safe & Call in Emergencies!</p>
    </footer>

</body>
</html>
